<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Website Responsive</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <div class="logo">
          <img src="asset/icon.svg" alt="" />
        </div>
        <nav>
          <a href="#">Studio</a>
          <a href="#">Capital</a>
          <a href="#">Companies</a>
          <a href="#">Team</a>
          <a href="#">About</a>
          <button>Build with Us →</button>
        </nav>
      </header>
      <main>
        <section class="hero">
          <h1 class="title">
            Building with Founders
            <span id="title">to Go Faster and Further</span>
            <p>
              <span id="description-title">High Alpha is a venture studio</span
              >. We create and fund B2B SaaS companies — partnering with
              founders to build businesses that reach their full potential.
            </p>
          </h1>
        </section>
      </main>
    </div>
  </body>
</html>
